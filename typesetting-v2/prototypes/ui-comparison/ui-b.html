<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI-B：明示モード切替ボタン</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .mode-bar {
    display: flex;
    justify-content: center;
    padding: 0.75rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .mode-switch {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.25rem;
    gap: 0.25rem;
  }
  .mode-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1.1rem;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    font-size: 0.95rem;
    min-height: 44px;
  }
  .mode-btn.active {
    background: var(--accent);
    color: #fff;
    font-weight: bold;
  }
  .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .view.active { display: flex; }
  .content-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 600px) {
    .mode-switch { width: 100%; }
    .mode-btn { flex: 1; justify-content: center; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-topbar">
    <span>TateSpun UI比較デモ</span>
    <span class="variant-tag">UI-B：明示モード切替ボタン</span>
  </div>

  <div class="mode-bar">
    <div class="mode-switch">
      <button class="mode-btn active" id="mode-editor" data-view="editor">✏️ 編集する</button>
      <button class="mode-btn" id="mode-settings" data-view="settings">⚙️ 設定する</button>
    </div>
  </div>

  <div class="content-area">
    <section class="view active" id="view-editor">
      <div id="toolbar"></div>
      <div id="manuscript-container"></div>
      <div id="preview-slot" style="padding: 0 1.25rem 1.25rem;"></div>
    </section>

    <section class="view" id="view-settings">
      <div id="settings-container"></div>
    </section>
  </div>
</div>

<script src="shared/content.js"></script>
<script>
  const modeBtns = document.querySelectorAll(".mode-btn");
  const views = { editor: document.getElementById("view-editor"), settings: document.getElementById("view-settings") };

  modeBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      modeBtns.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      Object.values(views).forEach((v) => v.classList.remove("active"));
      views[btn.dataset.view].classList.add("active");
      // Same state-preservation guarantee as UI-A: only CSS display toggles.
    });
  });

  const memo = TSDemo.createMemoOverlay();
  let previewOpen = false;
  const previewSlot = document.getElementById("preview-slot");

  TSDemo.renderToolbar(document.getElementById("toolbar"), {
    save: () => alert("保存しました（デモ）"),
    undo: () => {},
    redo: () => {},
    image: () => alert("挿絵を挿入（デモ）"),
    pagebreak: () => alert("改ページを挿入（デモ）"),
    preview: () => {
      previewOpen = !previewOpen;
      previewSlot.innerHTML = "";
      if (previewOpen) TSDemo.renderPreviewPlaceholder(previewSlot);
    },
    memo: () => memo.open(), // Memo opens directly from Editor mode — no detour through Settings mode.
  });

  TSDemo.renderManuscript(document.getElementById("manuscript-container"));
  TSDemo.renderSettingsForm(document.getElementById("settings-container"));
</script>
</body>
</html>
