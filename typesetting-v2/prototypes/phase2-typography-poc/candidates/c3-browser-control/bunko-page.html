<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>TSP-V2 P2-L01 — C1/C3 shared Publication (PDF) spike — 文庫</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* 文庫 1-column preset, read read-only from src/constants/paperSizes.ts */
  @page {
    size: 105mm 148mm;
    margin: 14mm 10mm 14mm 15mm; /* top right bottom left; gutter(left)=15mm outer(right)=10mm for a recto page */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    line-break: strict;
    word-break: normal;
    overflow-wrap: normal;
    font-family: 'Shippori Mincho', serif;
    font-size: 8.5pt;
    line-height: 1.7;
    color: #000;
  }
  p { margin: 0; text-indent: 1em; }
</style>
</head>
<body>
<p>「気が合った、と言ってしまえばそれまでだ。けれど気づけば、どこへ行くにも二人でいることが当たり前になっていた。」</p>
</body>
</html>
