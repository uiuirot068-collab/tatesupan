name: Phase 11 filename gate

on:
  push:
    branches: [tsp-phase11-toc-v2]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rgvqquuthovqjqfogfra.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Filename tests
        run: npx vitest run --config src/utils/vitest.config.ts src/utils/exportFilename.test.ts
      - name: Preflight tests
        run: npx vitest run --config src/lib/vitest.config.ts src/lib/exportPreflight.test.ts
      - name: TOC V2 tests
        run: npx vitest run --config src/lib/v2Bridge/vitest.config.ts src/lib/v2Bridge/tocPageNumbers.test.ts
