name: Phase 11 colophon parity gate

on:
  push:
    branches: [tsp-phase11-colophon-v2]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rgvqquuthovqjqfogfra.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Colophon bridge
        run: npx vitest run --config src/lib/v2Bridge/vitest.config.ts src/lib/v2Bridge/composeV2Document.test.ts
      - name: Export worker
        run: npx vitest run --config src/lib/v2Bridge/vitest.config.ts src/lib/v2Bridge/exportWorker.test.ts
